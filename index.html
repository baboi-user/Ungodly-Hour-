<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ungodly Hours</title>
<style>
:root{--ink:#aab4ff;--amber:#ffb067;--pill:#0b0720;--edge:#2c2670;--txt:#e9eaff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0a0410}
body{min-height:100vh;font-family:"Quicksand","Nunito","Varela Round",system-ui,sans-serif;color:var(--txt);
background:linear-gradient(180deg,#0a0410 0%,#170a2e 45%,#1c1558 100%) fixed;overflow-x:hidden;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#stars{position:fixed;inset:0;pointer-events:none}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.8}
svg.mtn{position:fixed;left:0;right:0;bottom:0;width:100%;height:30vh;pointer-events:none;z-index:0}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 20px 40px}
h1{margin:40px 0 0;width:min(84vw,400px);line-height:0;filter:drop-shadow(0 0 14px rgba(150,140,255,.35))}
.logo{width:100%;height:auto;display:block}
#panel{margin-top:auto;margin-bottom:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:40px}
body.res #panel{margin-top:36px;margin-bottom:0}
.lead{font-size:28px;margin:0 0 4px}
body.res .lead{display:none}
.seg{display:flex;padding:4px;border:1.5px solid var(--edge);border-radius:40px;background:#0f0a26}
.seg button{font:inherit;font-size:22px;padding:12px 26px;border-radius:30px;border:1.5px solid transparent;background:none;color:#6e72c4}
.seg button.on{background:#1f1a5a;border-color:#4a44a0;color:var(--txt)}
.time{display:flex;gap:14px}
.pill{position:relative;display:flex;align-items:center;justify-content:center;height:106px;border:1.5px solid var(--edge);border-radius:60px;background:var(--pill);padding:0 22px}
.pill select{appearance:none;-webkit-appearance:none;background:none;border:0;outline:0;font:inherit;font-weight:700;font-size:56px;color:inherit;text-align:center;text-align-last:center;padding:0 6px;width:auto}
.pill select option{font-size:20px;color:#222}
.pill .c{font-size:48px;font-weight:700;padding:0 2px 6px}
.time{color:#fff}
body.wake .time{color:var(--amber)}
.buf{display:flex;align-items:center;gap:10px;font-size:21px;color:#8f95e6;border:1.5px solid var(--edge);border-radius:40px;padding:8px 10px 8px 22px;background:#0f0a26}
.buf select{appearance:none;-webkit-appearance:none;font:inherit;font-weight:700;font-size:21px;color:var(--txt);background:#1f1a5a;border:1.5px solid #4a44a0;border-radius:30px;padding:8px 16px;text-align:center;text-align-last:center}
.buf select option{color:#222}
.go{font:inherit;font-weight:700;font-size:28px;color:#fff;background:var(--pill);border:1.5px solid var(--edge);border-radius:50px;padding:20px 32px}
body.wake .go.main{color:var(--amber)}
.go.alt{font-size:27px;color:#8f95e6;font-weight:600}
.go:active,.seg button:active{filter:brightness(1.4)}
#results{display:none;width:100%;max-width:480px;margin-top:28px;text-align:center}
body.res #results{display:block}
body.res .main,body.res #now{display:none}
#results h2{font-size:34px;color:var(--amber);margin:0 0 20px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#0e0724e6;border-radius:26px;padding:22px 8px 26px}
.card svg{width:34px;height:34px;display:block;margin:0 auto 10px}
.card .t{font-size:40px;font-weight:700;color:#fff;line-height:1.15}
.card .n{font-size:26px;font-weight:600;margin-top:6px}
.card .h{font-size:26px;font-weight:600;opacity:.9}
.card.mid .t,.card.mid .n,.card.mid .h{opacity:.8}
.card.bad .t,.card.bad .n,.card.bad .h{opacity:.55}
.foot{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
@media (max-width:360px){.pill select{font-size:46px}.card .t{font-size:32px}}
</style>
</head>
<body class="wake">
<div id="stars"></div>

<main>

4876 -357C4844 -406 4808 -471 4808 -525C4808 -550 4825 -572 4845 -590C4891 -561 4943 -534 5002 -534C5018 -534 5034 -537 5049 -541C5099 -572 5153 -620 5188 -652L5174 -670C5151 -653 5098 -619 5063 -619C5019 -619 4972 -654 4938 -684C4845 -626 4709 -529 4709 -445C4709 -329 4842 -222 4842 -140C4842 -116 4830 -96 4813 -76C4790 -103 4756 -132 4714 -132C4670 -132 4601 -62 4554 -15L4570 3C4579 -6 4613 -36 4646 -36C4680 -36 4716 -6 4742 18ZM5659 34C5742 0 5822 -41 5895 -89C5919 -168 5920 -256 5920 -337C5920 -361 5920 -386 5919 -410C5856 -426 5795 -449 5741 -482C5674 -440 5605 -400 5534 -362C5520 -283 5512 -204 5512 -124C5512 -104 5512 -85 5513 -65C5558 -28 5607 4 5659 34ZM5782 -55C5727 -69 5679 -98 5637 -131C5633 -167 5630 -203 5630 -238C5630 -318 5646 -372 5661 -397C5707 -378 5755 -361 5806 -354C5808 -327 5810 -299 5810 -272C5810 -199 5801 -126 5782 -55ZM6384 -424C6388 -312 6388 -201 6388 -98L6321 -62C6283 -78 6237 -97 6204 -104C6235 -146 6239 -208 6239 -259C6239 -310 6237 -362 6235 -414C6209 -433 6160 -470 6157 -473L6023 -379L6037 -365L6072 -384C6091 -379 6103 -368 6114 -356C6124 -312 6133 -269 6133 -224C6133 -163 6117 -93 6081 -42C6127 -25 6190 3 6232 35C6270 0 6333 -48 6395 -73L6459 32L6618 -88L6612 -101L6562 -81C6560 -80 6552 -79 6550 -79C6522 -79 6502 -154 6502 -158C6502 -259 6504 -359 6519 -459L6505 -468ZM6904 -334C6919 -321 6927 -316 6942 -316C6948 -316 6951 -318 6954 -320C6990 -343 7028 -368 7056 -394V-407C7045 -403 7029 -398 7020 -398C6990 -398 6966 -443 6946 -471L6839 -380V-411L6754 -473L6615 -382L6626 -368L6670 -380C6688 -369 6702 -355 6717 -340C6720 -296 6721 -266 6721 -222C6721 -187 6720 -119 6708 -76C6752 -44 6795 -11 6833 26L7006 -80V-101L6916 -70C6847 -124 6839 -123 6838 -147C6836 -176 6836 -206 6836 -236C6836 -286 6838 -341 6840 -359C6844 -363 6853 -370 6858 -373ZM7545 -442 7534 -461C7510 -445 7474 -428 7450 -428C7430 -428 7410 -432 7393 -442L7327 -480L7140 -377V-238C7140 -217 7167 -183 7186 -167C7248 -198 7291 -225 7325 -225C7349 -225 7367 -210 7382 -195C7385 -167 7387 -139 7387 -112C7387 -88 7386 -61 7382 -38C7333 -76 7256 -131 7217 -131C7199 -131 7182 -129 7165 -125L7039 -26L7050 -10C7075 -26 7104 -41 7136 -41C7192 -41 7249 1 7290 35C7352 4 7419 -21 7486 -44C7500 -83 7505 -124 7505 -165C7505 -199 7501 -233 7496 -266C7477 -280 7456 -292 7434 -302C7383 -279 7330 -256 7279 -239C7260 -269 7251 -306 7251 -339C7251 -362 7255 -385 7260 -408C7302 -379 7358 -342 7402 -342Z"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d0ff"/><stop offset="1" stop-color="#ffb067"/></linearGradient></defs></svg></h1>
<section id="panel">
<p class="lead">I want to…</p>
<div class="seg" role="tablist">
<button id="mBed" type="button">go to bed at</button>
<button id="mWake" type="button">wake up at</button>
</div>
<div class="time">
<label class="pill"><select id="hh" aria-label="Hour"></select><span class="c">:</span><select id="mm" aria-label="Minutes"></select></label>
<label class="pill"><select id="ap" aria-label="AM or PM"><option>AM</option><option>PM</option></select></label>
</div>
<label class="buf">fall-asleep buffer <select id="bf" aria-label="Fall-asleep buffer"></select></label>
<button id="calc" class="go main" type="button">Calculate &nbsp;→</button>
<button id="now" class="go alt" type="button">Sleep now 😴</button>
</section>
<section id="results">
<h2 id="head"></h2>
<div class="grid" id="grid"></div>
<div class="foot"><button id="now2" class="go alt" type="button">Sleep now 😴</button></div>
</section>
</main>
<script>
(function(){
var CYCLE=90, FALL=0, $=function(i){return document.getElementById(i)};
var mode='bed', bf=$('bf'), hh=$('hh'), mm=$('mm'), ap=$('ap');

function pad(n){return (n<10?'0':'')+n}
function fmt(min){
  min=((min%1440)+1440)%1440;
  var h24=Math.floor(min/60), m=min%60;
  return ((h24%12)||12)+':'+pad(m)+' '+(h24>=12?'PM':'AM');
}
function toMin(h,m,p){return (h%12)*60+m+(p==='PM'?720:0)}
function hrs(n){var x=n*1.5;return (x%1===0?x:x.toFixed(1))+' hr'}
// Pure calc: 6..1 cycles, best first.
function calc(m,t){
  var out=[];
  for(var n=6;n>=1;n--) out.push({n:n,time:fmt(m==='wake'?t-n*CYCLE-FALL:t+FALL+n*CYCLE),dur:hrs(n)});
  return out;
}
window.__calc=calc; window.__fmt=fmt;

var FACE={
 good:'<svg viewBox="0 0 24 24" fill="none" stroke="#2fd36b" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="8.8" cy="9.5" r=".9" fill="#2fd36b"/><circle cx="15.2" cy="9.5" r=".9" fill="#2fd36b"/><path d="M7.5 14c1.2 2.4 7.8 2.4 9 0"/></svg>',
 mid:'<svg viewBox="0 0 24 24" fill="none" stroke="#d9a21b" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="8.8" cy="9.5" r=".9" fill="#d9a21b"/><circle cx="15.2" cy="9.5" r=".9" fill="#d9a21b"/><path d="M8 15.5h8"/></svg>',
 bad:'<svg viewBox="0 0 24 24" fill="none" stroke="#e04a4a" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><circle cx="8.8" cy="9.5" r=".9" fill="#e04a4a"/><circle cx="15.2" cy="9.5" r=".9" fill="#e04a4a"/><path d="M7.5 16.5c1.2-2.4 7.8-2.4 9 0"/></svg>'};

function render(m,t,showing){
  var rows=calc(m,t), g=$('grid'), s='';
  rows.forEach(function(r){
    var k=r.n>=5?'good':r.n>=3?'mid':'bad';
    s+='<div class="card '+(k==='good'?'':k)+'">'+FACE[k]+'<div class="t">'+r.time+'</div><div class="n">'+r.n+(r.n>1?' cycles':' cycle')+'</div><div class="h">'+r.dur+'</div></div>';
  });
  g.innerHTML=s;
  $('head').textContent=m==='wake'?'You should go to bed at:':'You should wake up at:';
  document.body.classList.add('res');
  window.scrollTo(0,0);
}

function setMode(m){
  mode=m;
  document.body.classList.toggle('wake',m==='wake');
  $('mBed').classList.toggle('on',m==='bed');
  $('mWake').classList.toggle('on',m==='wake');
}
function setClock(min){
  min=((min%1440)+1440)%1440;
  var h24=Math.floor(min/60), m=min%60;
  hh.value=String((h24%12)||12); mm.value=pad(m); ap.value=h24>=12?'PM':'AM';
}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function selected(){return toMin(parseInt(hh.value,10),parseInt(mm.value,10),ap.value)}

// build selects
for(var h=1;h<=12;h++){var o=document.createElement('option');o.value=o.textContent=String(h);hh.appendChild(o)}
for(var m=0;m<60;m+=5){var p=document.createElement('option');p.value=p.textContent=pad(m);mm.appendChild(p)}

[0,5,10,15,20,25,30,45,60].forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v+' min';bf.appendChild(o)});
bf.value='0';
// stars
var st=$('stars');
for(var i=0;i<22;i++){var d=document.createElement('i');d.style.left=(Math.random()*100)+'%';d.style.top=(Math.random()*65)+'%';d.style.opacity=.3+Math.random()*.6;st.appendChild(d)}

// events
$('mBed').onclick=function(){setMode('bed');refresh()};
$('mWake').onclick=function(){setMode('wake');refresh()};
function refresh(){ if(document.body.classList.contains('res')) render(mode,selected()); }
[hh,mm,ap].forEach(function(e){e.onchange=refresh});
bf.onchange=function(){FALL=parseInt(bf.value,10)||0;refresh()};
$('calc').onclick=function(){render(mode,selected())};
function sleepNow(){
  var t=nowMin(); setMode('bed');
  setClock(Math.round(t/5)*5);
  render('bed',t); // exact current time
}
$('now').onclick=sleepNow; $('now2').onclick=sleepNow;

// default = device's current time, "go to bed at"
setMode('bed');
setClock(Math.round(nowMin()/5)*5);
})();
</script>
</body>
</html>
