name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Generate Android project around index.html
        run: |
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/drawable app/src/main/java/com/ungodlyhours/app
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "UngodlyHours"
          include ':app'
          E
          cat > build.gradle <<'E'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          E
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'E'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ungodlyhours.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ungodlyhours.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Ungodly Hours" android:icon="@drawable/ic_launcher"
                  android:allowBackup="true" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          E
          cat > app/src/main/res/values/styles.xml <<'E'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0A0410</item>
                  <item name="android:navigationBarColor">#1C1558</item>
                  <item name="android:windowBackground">#0A0410</item>
              </style>
          </resources>
          E
          cat > app/src/main/res/drawable/ic_launcher.xml <<'E'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#170A2E" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFB067" android:pathData="M70,30a26,26 0 1,0 8,40a20,20 0 1,1 -8,-40z"/>
          </vector>
          E
          cat > app/src/main/java/com/ungodlyhours/app/MainActivity.java <<'E'
          package com.ungodlyhours.app;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0A0410"));
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          E
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: UngodlyHours-apk
          path: app/build/outputs/apk/debug/app-debug.apk
